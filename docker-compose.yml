# Local development only. Production deployment stays in infra/ and k8s/.

x-node-app: &node-app
  init: true
  environment:
    NODE_ENV: development
    CHOKIDAR_USEPOLLING: "true"
    WATCHPACK_POLLING: "true"
    TSC_WATCHFILE: DynamicPriorityPolling
    TSC_WATCHDIRECTORY: DynamicPriorityPolling
    npm_config_update_notifier: "false"
  volumes:
    - .:/workspace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lastbite}
      POSTGRES_USER: ${POSTGRES_USER:-lastbite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lastbite}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    ports:
      - "56720:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lastbite}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  lb-api:
    <<: *node-app
    env_file:
      - apps/lb-api/.env
    build:
      context: .
      dockerfile: apps/lb-api/Dockerfile
    working_dir: /workspace/apps/lb-api
    command: sh -c "npm install --ignore-scripts && npm run start"
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: "3000"
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-lastbite}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-lastbite}}
      REDIS_URL: ${LOCAL_REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${LOCAL_RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-lastbite}:${RABBITMQ_DEFAULT_PASS:-change-me}@rabbitmq:5672}
      S3_ENDPOINT: ${LOCAL_S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-lastbite}}
      S3_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-change-me}}
      S3_BUCKET: ${LOCAL_S3_BUCKET:-lastbite-local}
    ports:
      - "3000:3000"
    volumes:
      - lb_api_node_modules:/workspace/apps/lb-api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  lb-web:
    <<: *node-app
    build:
      context: .
      dockerfile: apps/lb-web/Dockerfile
    working_dir: /workspace/apps/lb-web
    command: sh -c "npm install --ignore-scripts && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      NUXT_HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
      NUXT_PUBLIC_GRAPHQL_ENDPOINT: ${NUXT_PUBLIC_GRAPHQL_ENDPOINT:-http://localhost:3000/graphql}
    ports:
      - "5173:5173"
    volumes:
      - lb_web_node_modules:/workspace/apps/lb-web/node_modules

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  lb_api_node_modules:
  lb_web_node_modules:
