name: CI

# Path filtering is done with a `changes` job instead of `on.paths`. A workflow skipped
# by `paths:` never creates its checks, so a required check would wait forever; a job
# skipped by `if:` reports as passed. Mark lb-api, lb-merchant and lb-customer as required.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lb-api: ${{ steps.filter.outputs.lb-api }}
      lb-merchant: ${{ steps.filter.outputs.lb-merchant }}
      lb-customer: ${{ steps.filter.outputs.lb-customer }}
    steps:
      - uses: actions/checkout@v4

      # Editing this workflow re-runs every app.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lb-api:
              - apps/lb-api/**
              - .github/workflows/ci.yml
            lb-merchant:
              - apps/lb-merchant/**
              - .github/workflows/ci.yml
            lb-customer:
              - apps/lb-customer/**
              - .github/workflows/ci.yml

  lb-api:
    needs: changes
    if: needs.changes.outputs.lb-api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lb-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lb-api/package-lock.json

      - run: npm ci

      # The package.json scripts use --fix / --write; CI must only report.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Prettier
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      # Tests load .env.test.local. Every external client is mocked, so these are
      # placeholder values, not real services or secrets.
      - name: Create test env
        run: |
          cat > .env.test.local <<'EOF'
          DATABASE_URL=postgresql://test:test@localhost:5432/test
          REDIS_URL=redis://localhost:6379
          AUTH_REFRESH_TOKEN_KEY=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
          APP_ENV=test
          COGNITO_USER_POOL_ID=us-east-1_testpool
          COGNITO_CLIENT_ID=test-client-id
          COGNITO_CLIENT_SECRET=test-client-secret
          COGNITO_DOMAIN=https://auth.example.test
          COGNITO_REDIRECT_URI=http://localhost:3000/auth/callback
          CUSTOMER_APP_URL=http://customer.test
          MERCHANT_APP_URL=http://merchant.test
          EOF

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  lb-merchant:
    needs: changes
    if: needs.changes.outputs.lb-merchant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lb-merchant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lb-merchant/package-lock.json

      - run: npm ci

      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - name: Prettier
        run: npx prettier --check src/

      - name: Unit tests
        run: npm run test:unit -- --run

      # Runs type-check and the production build.
      - name: Build
        run: npm run build

  lb-customer:
    needs: changes
    if: needs.changes.outputs.lb-customer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lb-customer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lb-customer/package-lock.json

      # postinstall runs `nuxt prepare`, which generates the types the build needs.
      - run: npm ci

      # lb-customer has no lint, prettier or test setup yet; the build is the only check.
      - name: Build
        run: npm run build
